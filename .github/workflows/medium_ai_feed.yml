name: Run Medium AI Filter

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# Add this permission block so the runner can save the history.json updates back to the repo
permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute AI Filter Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # ✓ 100% Locked down
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    # The auto-commit magic step
    - name: Commit history updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history.json
        git commit -m "Update processed articles log [skip ci]" || exit 0
        git push
